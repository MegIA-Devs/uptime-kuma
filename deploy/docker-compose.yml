services:
  uptime-kuma:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.megia
      args:
        BRANCH: megia-custom
    image: megia/uptime-kuma:latest
    container_name: uptime-kuma-megia
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_IS_CONTAINER=1
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.uptime-kuma-megia.rule=Host(`status.megia.com.co`)"
      - "traefik.http.routers.uptime-kuma-megia.entrypoints=https"
      - "traefik.http.routers.uptime-kuma-megia.tls=true"
      - "traefik.http.routers.uptime-kuma-megia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.uptime-kuma-megia.service=uptime-kuma-megia"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.uptime-kuma-megia-http.rule=Host(`status.megia.com.co`)"
      - "traefik.http.routers.uptime-kuma-megia-http.entrypoints=http"
      - "traefik.http.routers.uptime-kuma-megia-http.middlewares=uptime-kuma-megia-https@docker"
      - "traefik.http.middlewares.uptime-kuma-megia-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.uptime-kuma-megia-https.redirectscheme.permanent=true"
      # Service
      - "traefik.http.services.uptime-kuma-megia.loadbalancer.server.port=3001"
    networks:
      - coolify

volumes:
  uptime-kuma-data:
    name: uptime-kuma-megia-data

networks:
  coolify:
    external: true
