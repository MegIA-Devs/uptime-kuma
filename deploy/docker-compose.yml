services:
  uptime-kuma:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.megia
      args:
        BRANCH: megia-custom
    image: megia/uptime-kuma:latest
    container_name: uptime-kuma-megia
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_IS_CONTAINER=1
      # GitHub token for pushing updates back to the fork.
      # Generate at: https://github.com/settings/tokens (needs repo scope)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    networks:
      - coolify

volumes:
  uptime-kuma-data:
    name: uptime-kuma-megia-data

networks:
  coolify:
    external: true
